    <!-- ## CRIMSON WORLD — progressive enhancement with shared Welcome scenery. -->
    <style>
      #crimson-world {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: #0b080e;
        opacity: 0;
        transition: opacity 1s;
      }
      #crimson-world[data-visible="true"] {
        opacity: 1;
      }
      #crimson-world canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity .65s ease;
      }
      #crimson-world[data-webgl="true"] canvas { opacity: 1; }
      .crimson-fallback { transition: opacity .65s ease; }
      .crimson-fallback {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 78% 32%, #7c172b66, transparent 40%),
          linear-gradient(120deg, #09080f 20%, #240d17 70%, #09080f);
      }
      .crimson-moon {
        position: absolute;
        width: clamp(160px, 25vw, 390px);
        aspect-ratio: 1;
        border-radius: 50%;
        right: 8%;
        top: 13%;
        background: radial-gradient(
          circle at 33% 25%,
          #e67877,
          #b73649 35%,
          #75182c 67%,
          #260c18
        );
        box-shadow: 0 0 100px #9e203329;
        opacity: 0.65;
      }
      .crimson-arches {
        position: absolute;
        width: 45vw;
        height: 85vh;
        border: 1px solid #d8796430;
        border-radius: 50% 50% 0 0;
        right: 9%;
        top: 24%;
        box-shadow:
          0 0 0 30px #bc46530a,
          0 0 0 90px #b5434d08;
      }
      #crimson-world[data-webgl="true"] .crimson-fallback {
        opacity: 0;
      }
      .motion-off #crimson-world canvas {
        display: none;
      }
      .motion-off #crimson-world .crimson-fallback {
        opacity: 1;
      }
      .crimson-vignette {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, #09080ed9, transparent 65%),
          linear-gradient(0deg, #09080e80, transparent 35%, #09080e20);
      }
      .crimson-active #root {
        position: relative;
        z-index: 1;
      }
      .crimson-active .site {
        --surface: #130f16;
        --raised: #1b141c;
        --muted: #c8c0ca;
        --subtle: #b3a8b5;
        --line: #cb8a7830;
        background: transparent;
      }
      .crimson-active .site main > section {
        background: transparent;
      }
      .crimson-active .site .hero-photo,
      .crimson-active .site .hero-art,
      .crimson-active .site .about-art,
      .crimson-active .site .skills-art,
      .crimson-active .site .experience-art,
      .crimson-active .site .contact-art,
      .crimson-active .site .projects-heading > .section-avatar,
      .crimson-active .site .character-image,
      .crimson-active .site .avatar-motion-dock,
      .crimson-active .site .avatar-speech,
      .crimson-active .site .avatar-guide-collapsed,
      .crimson-active .site .chapter-picture img {
        display: none !important;
      }
      .crimson-active .cinematic .hero-phase-one {
        background: linear-gradient(
          90deg,
          #09080ee6 0%,
          #09080e99 42%,
          transparent 75%
        );
        grid-template-columns: 1fr 1fr;
      }
      .crimson-active .cinematic .hero-phase-one .hero-copy {
        max-width: 520px;
        width: 100%;
      }
      .crimson-active .hero-introduction .accent-text {
        white-space: normal;
      }
      .crimson-active .cinematic .hero h1 {
        font-size: clamp(50px, 5.4vw, 78px);
        line-height: 1.03;
      }
      .crimson-active .cinematic .hero-secondary {
        font-size: clamp(28px, 2.7vw, 39px);
      }
      .crimson-active .cinematic .hero-description {
        max-width: 470px;
      }
      .crimson-active .cinematic .about-section,
      .crimson-active .cinematic .skills-layout,
      .crimson-active .cinematic .experience-layout,
      .crimson-active .cinematic .contact-layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
      }
      .crimson-active .cinematic .about-copy {
        max-width: 760px;
      }
      .crimson-active .cinematic .chapter-rail {
        background: #110d15d9;
      }
      .crimson-active .cinematic .chapter-picture {
        height: 80px;
        background: transparent;
      }
      .crimson-active .cinematic .chapter-quote {
        inset: 10px;
        width: auto;
        font-size: 14px;
      }
      .crimson-active .cinematic .project-workspace {
        background: #100d16e8;
      }
      .crimson-active .cinematic .skill-card,
      .crimson-active .cinematic .timeline-entry {
        background: #130f16e8;
      }
      .crimson-active .cinematic .header:not(.on-hero) {
        background: #100c14ed;
      }
      .crimson-active .cinematic .hero-message-stack {
        position: relative;
      }
      .crimson-active .hero-message-stack[data-writer] .hero-message-item {
        opacity: 0 !important;
      }
      .crimson-writing {
        grid-area: 1/1;
        color: #f2d1a6;
        font-size: 16px;
        font-weight: 500;
        line-height: 1.65;
        white-space: pre-wrap;
        pointer-events: none;
      }
      .crimson-writing[data-typing="true"]:after {
        content: "";
        display: inline-block;
        height: 1em;
        width: 2px;
        margin-inline-start: 4px;
        background: #efb997;
        vertical-align: -0.12em;
        animation: crimson-caret 0.8s steps(2, end) infinite;
      }
      @keyframes crimson-caret {
        50% {
          opacity: 0;
        }
      }
      /* ## SINGLE GUARDIAN — one visual shell; existing React guide owns dialogue. */
      #journey-guide {
        position: fixed;
        inset: 0;
        z-index: 12;
        pointer-events: none;
        color: #f4edf1;
        font-family: "DM Sans", "Noto Sans Arabic", sans-serif;
      }
      #journey-guide[hidden],
      #journey-guide [hidden] {
        display: none !important;
      }
      .journey-character {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 425px;
        transform-origin: 50% 70%;
        pointer-events: none;
      }
      .journey-character:after {
        content: "";
        position: absolute;
        width: 65%;
        height: 13%;
        left: 17%;
        bottom: 0;
        border-radius: 50%;
        background: radial-gradient(ellipse, #d959492e, transparent 65%);
        transform: scaleX(1.4);
      }
      .journey-character img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.48s ease;
        filter: drop-shadow(0 10px 25px #0008);
      }
      .journey-character img[data-active="true"] {
        opacity: 1;
      }
      .journey-bubble {
        position: absolute;
        width: 270px;
        right: 24px;
        top: 110px;
        padding: 17px;
        border: 1px solid #be6f7470;
        border-radius: 16px 16px 4px 16px;
        background: linear-gradient(140deg, #221520f5, #100d16f7);
        box-shadow:
          0 16px 45px #0004,
          inset 0 1px #f7b5a91a;
        pointer-events: auto;
        transition:
          opacity 0.24s,
          transform 0.24s;
      }
      .journey-bubble:before {
        content: "";
        position: absolute;
        width: 36px;
        height: 2px;
        top: -1px;
        inset-inline-start: 18px;
        background: #f5c66a;
      }
      .journey-bubble header {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #dfbcac;
        font-size: 12px;
      }
      .journey-bubble header strong {
        flex: 1;
        font-weight: 500;
      }
      .journey-bubble button {
        color: inherit;
        font: inherit;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      .journey-bubble .journey-control {
        width: 32px;
        min-height: 36px;
        border: 1px solid #c98a7630;
        border-radius: 7px;
        font-size: 20px;
      }
      .journey-bubble .journey-message {
        display: grid;
        width: 100%;
        text-align: start;
        line-height: 1.7;
        font-size: 15px;
        min-height: 108px;
        padding: 12px 0;
      }
      .journey-message > span {
        grid-area: 1/1;
      }
      .journey-reserve {
        visibility: hidden;
      }
      .journey-bubble footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: #e8bd81;
        font-size: 12px;
        border-top: 1px solid #c98a7630;
        padding-top: 9px;
      }
      .journey-bubble .journey-next {
        min-height: 36px;
        text-align: end;
      }
      .journey-bubble .journey-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #e0978c;
        box-shadow: 0 0 10px #dd5c6266;
      }
      .journey-launcher {
        position: absolute;
        right: 22px;
        bottom: 24px;
        pointer-events: auto;
        border: 1px solid #c98a7666;
        background: #160f1a;
        border-radius: 24px;
        padding: 12px 18px;
        color: #f1d4b3;
        font:
          14px "DM Sans",
          "Noto Sans Arabic",
          sans-serif;
        cursor: pointer;
      }
      #journey-guide button:focus-visible {
        outline: 2px solid #f5c66a;
        outline-offset: 4px;
      }
      #journey-guide button:hover {
        color: #fff;
      }
      #journey-guide[data-mode="dismissed"] .journey-character {
        opacity: 0;
      }
      .journey-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (max-width: 1099px) {
        .crimson-active .site {
          padding-bottom: 190px;
        }
        .journey-bubble {
          top: auto !important;
          bottom: 16px;
          right: 16px;
          width: min(340px, calc(100vw - 128px));
          padding: 10px 13px;
        }
        .journey-bubble .journey-message {
          min-height: 0;
          max-height: 80px;
          overflow: auto;
          font-size: 13px;
          padding: 7px 0;
        }
        .journey-bubble footer {
          padding-top: 4px;
        }
        .journey-bubble header {
          font-size: 11px;
        }
        .journey-bubble .journey-control {
          width: 28px;
          min-height: 28px;
        }
        .journey-bubble .journey-next {
          min-height: 28px;
        }
        .crimson-active .cinematic .hero-phase-one {
          min-height: 800px;
        }
      }
      @media (max-width: 767px) {
        .crimson-active .cinematic .hero-phase-one {
          grid-template-columns: 1fr;
          padding-top: 285px;
          min-height: 1050px;
          height: auto;
          background: linear-gradient(0deg, #09080ef2 35%, #09080e11);
        }
        .crimson-active .cinematic .hero h1 {
          font-size: clamp(44px, 11vw, 62px);
        }
        .crimson-active .cinematic .hero-secondary {
          font-size: 29px;
        }
        .crimson-active .site main > section {
          scroll-margin-top: 90px;
        }
        .crimson-active .cinematic .chapter-picture {
          height: 95px;
        }
        .crimson-active .cinematic .hero-bottom {
          bottom: 24px;
        }
        .crimson-vignette {
          background: linear-gradient(0deg, #09080eb3, transparent 80%);
        }
      }
      html[data-theme="light"] .crimson-active .site {
        --surface: #f6f0ee;
        --raised: #fffaf7;
        --muted: #574a52;
        --subtle: #62525e;
      }
      html[data-theme="light"] #crimson-world {
        background: #eee5e3;
      }
      html[data-theme="light"] #crimson-world canvas {
        opacity: 0.08;
      }
      html[data-theme="light"] .crimson-vignette {
        background: #f5efead9;
      }
      html[data-theme="light"] .crimson-active .cinematic .skill-card,
      html[data-theme="light"] .crimson-active .cinematic .timeline-entry,
      html[data-theme="light"] .crimson-active .cinematic .project-workspace,
      html[data-theme="light"] .crimson-active .cinematic .chapter-rail {
        background: #f6f0eee8;
      }
      html[data-theme="light"]
        .crimson-active
        .cinematic
        .header:not(.on-hero) {
        background: #f5efeaee;
      }
      @media (prefers-reduced-motion: reduce) {
        #crimson-world,
        .journey-character img,
        .journey-bubble {
          transition: none;
        }
        .crimson-writing:after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ## WORLD LAYERS — static fallback also covers reduced motion / no WebGL. -->
    <div id="crimson-world" aria-hidden="true">
      <div class="crimson-fallback">
        <div class="crimson-moon"></div>
        <div class="crimson-arches"></div>
      </div>
      <div class="crimson-vignette"></div>
    </div>
    <div id="root"></div>
    <!-- ## ONE AVATAR AND SPEECH SURFACE — actions forward to the existing guide. -->
    <aside id="journey-guide" aria-label="Digital guide" hidden>
      <div class="journey-character" aria-hidden="true">
        <img alt="" width="600" height="850" /><img
          alt=""
          width="600"
          height="850"
        />
      </div>
      <section class="journey-bubble">
        <header>
          <span class="journey-dot" aria-hidden="true"></span><strong></strong
          ><button
            class="journey-control"
            data-action="minimize"
            aria-label="Minimize guide"
          >
            −</button
          ><button
            class="journey-control"
            data-action="dismiss"
            aria-label="Dismiss guide"
          >
            ×
          </button>
        </header>
        <p
          class="journey-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>
        <button
          class="journey-message"
          data-action="complete"
          aria-label="Show the complete message"
        >
          <span aria-hidden="true"></span
          ><span class="journey-reserve" aria-hidden="true"></span>
        </button>
        <footer>
          <span class="journey-position" dir="ltr" aria-hidden="true"></span
          ><button class="journey-next" data-action="next"></button>
        </footer>
      </section>
      <button class="journey-launcher" data-action="show" hidden>
        Show guide
      </button>
    </aside>
    <script type="module" src="/src/main.jsx"></script>
    <!-- ## IMPLEMENTATION — all new application code lives in this index.html. -->
    <script type="module">
      import { avatarScenes, loadAvatarPose } from "/src/avatarPoseRegistry.js";
      import { guideCopy, guideSections } from "/src/guideDialogue.js";
      import { stopBeforeFooter } from "/src/guideBoundary.js";

      // ## LIFECYCLE AND EXISTING-APP BRIDGE
      // React keeps owning section selection, visit preferences and speech timing.
      // This single presentation layer reads their rendered signals, not a second
      // competing scroll/dialogue controller. No React-owned nodes are moved.
      const root = document.getElementById("root");
      const world = document.getElementById("crimson-world");
      const guide = document.getElementById("journey-guide");
      const character = guide.querySelector(".journey-character");
      const pictures = [...character.querySelectorAll("img")];
      const bubble = guide.querySelector(".journey-bubble");
      const launcher = guide.querySelector(".journey-launcher");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const state = {
        ready: false,
        welcome: true,
        blocked: true,
        motion: true,
        section: "home",
        mode: "expanded",
        lang: "en",
        level: "balanced",
        light: false,
      };
      let frame = 0,
        last = 0,
        time = 0,
        scene = null,
        loading = false,
        disposed = false;
      let poseVersion = 0,
        pictureIndex = 0,
        currentPose = "",
        writer = null,
        writerKey = "",
        writerCount = 0,
        writerTime = 0;
      let heroVisible = true,
        targetDirty = true,
        x = 0,
        y = 0,
        h = 0,
        progress = 0,
        pointerX = 0,
        pointerY = 0,
        mobileSlotTop = 0;
      let bubbleHeight = 244;
      let footerTop = Infinity;
      let guideLayout = "";
      const bubbleSize = new ResizeObserver(([entry]) => {
        bubbleHeight =
          entry.borderBoxSize?.[0]?.blockSize ||
          bubble.getBoundingClientRect().height;
        wake();
      });
      bubbleSize.observe(bubble);
      const removals = [];
      function listen(node, event, fn, options) {
        node.addEventListener(event, fn, options);
        removals.push(() => node.removeEventListener(event, fn, options));
      }
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const running = () => (state.welcome || (state.ready && !state.blocked)) && !document.hidden;
      function wake() {
        if (!frame && !disposed) frame = requestAnimationFrame(tick);
      }
      function text(node, value) {
        if (node.textContent !== value) node.textContent = value;
      }
      function sourceFrame() {
        return root.querySelector(".avatar-guide-frame");
      }
      function sync() {
        const site = root.querySelector(".site");
        if (!site) return;
        document.body.classList.add("crimson-active");
        const portfolio = root.querySelector(".portfolio-content");
        state.ready =
          portfolio?.dataset.ready === "true" &&
          !portfolio.hasAttribute("inert");
        state.blocked = site.dataset.motionBlocked === "true";
        state.welcome = !!root.querySelector(".welcome-experience");
        state.motion =
          !reduced.matches &&
          !document.documentElement.classList.contains("motion-off");
        state.level = site.dataset.motionLevel || "balanced";
        state.lang = document.documentElement.lang === "ar" ? "ar" : "en";
        state.light = document.documentElement.dataset.theme === "light";
        const source = sourceFrame();
        const collapsed = root.querySelector(".avatar-guide-collapsed");
        if (source) state.section = source.dataset.section;
        else if (collapsed)
          state.section =
            guideSections.find((id) =>
              collapsed
                .closest(".section-avatar")
                ?.classList.contains(`avatar-${id}`),
            ) || state.section;
        state.mode = collapsed
          ? collapsed.classList.contains("dismissed")
            ? "dismissed"
            : "minimized"
          : "expanded";
        world.dataset.visible = String(state.ready || state.welcome);
        guide.hidden = !state.ready || state.blocked;
        guide.dataset.mode = state.mode;
        guide.dir = state.lang === "ar" ? "rtl" : "ltr";
        const copy = guideCopy[state.lang],
          dialogue = copy.dialogue[state.section];
        guide.setAttribute("aria-label", copy.label);
        text(
          bubble.querySelector("strong"),
          `${avatarScenes[state.section].number} / ${state.lang === "ar" ? ["الرئيسية", "نبذة عني", "المهارات", "المشاريع", "الخبرة", "التواصل"][guideSections.indexOf(state.section)] : avatarScenes[state.section].name}`,
        );
        bubble.hidden = state.mode !== "expanded";
        launcher.hidden = state.mode === "expanded";
        text(launcher, copy.show);
        text(bubble.querySelector(".journey-status"), dialogue.message);
        text(bubble.querySelector(".journey-reserve"), dialogue.message);
        text(
          bubble.querySelector(".journey-next"),
          `${dialogue.action} ${state.lang === "ar" ? "←" : "→"}`,
        );
        text(
          bubble.querySelector(".journey-position"),
          `${avatarScenes[state.section].number} / 06`,
        );
        guide.querySelector('[data-action="minimize"]').ariaLabel =
          copy.minimize;
        guide.querySelector('[data-action="dismiss"]').ariaLabel = copy.dismiss;
        guide.querySelector('[data-action="complete"]').ariaLabel =
          copy.complete;
        text(
          bubble.querySelector(".journey-message span"),
          source
            ? [
                ...source.querySelectorAll(
                  '.avatar-guide-word[data-shown="true"]',
                ),
              ]
                .map((n) => n.textContent)
                .join("")
            : dialogue.message,
        );
        if (currentPose !== state.section) setPose(state.section);
        syncWriter();
        targetDirty = true;
        if ((state.ready || state.welcome) && state.motion && !state.light && !scene && !loading)

        last = 0;
        sync();
      });
      if (import.meta.hot) import.meta.hot.dispose(dispose);
      sync();
    </script>
  </body>
</html>
